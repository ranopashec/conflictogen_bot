[project]
name = "ssl-conflict-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "cryptography>=46,<48"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
